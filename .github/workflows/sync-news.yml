name: Sync Verified Gaming News

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run verified RSS news sync
        run: python3 scripts/sync_news.py

      - name: Commit updated verified news if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-verified.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(news): actualizar noticias verificadas desde fuentes oficiales"
            git push
          fi
