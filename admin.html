<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel Administrativo — KRONO Game Store</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/aurora-case.css" />
    <style>
      .admin-shell { padding: 32px 0 64px; }
      .admin-banner { padding: 18px 20px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); margin-bottom: 24px; }
      .admin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
      .stat-card { padding: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
      .stat-card span { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); text-transform: uppercase; }
      .stat-card strong { font-size: 24px; font-weight: 800; }
      .admin-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
      .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .admin-table th, .admin-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); text-align: left; }
      .admin-table th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--ink-muted); background: var(--surface-subtle); }
      @media (max-width: 820px) { .admin-stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Volver a KRONO">
          <img src="assets/brand/krono-horizontal.svg" alt="KRONO" class="brand-logo-img" width="150" height="30" />
        </a>
        <div class="header-actions">
          <span class="meta-tag" id="adminRoleBadge">Verificando permisos RBAC...</span>
          <a href="index.html" class="btn btn-secondary btn-sm">← Volver a la tienda</a>
        </div>
      </div>
    </header>

    <main class="container admin-shell">
      <div class="section-header">
        <div>
          <p class="section-eyebrow">Administración protegida · RBAC + Auditoría</p>
          <h1 class="section-title" style="font-size: 28px">Panel de Control KRONO</h1>
        </div>
      </div>

      <div id="adminStatusBanner" class="admin-banner"></div>

      <div class="admin-stats">
        <div class="stat-card"><span>Catálogo verificado</span><strong id="statGames">0</strong></div>
        <div class="stat-card"><span>Noticias activas</span><strong id="statNews">0</strong></div>
        <div class="stat-card"><span>Pedidos (BD)</span><strong id="statOrders">—</strong></div>
        <div class="stat-card"><span>Estado Backend</span><strong id="statBackend">Pendiente</strong></div>
      </div>

      <div class="section-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-admin-tab="catalog">Catálogo</button>
        <button type="button" class="tab-btn" data-admin-tab="news">Noticias y fuentes</button>
        <button type="button" class="tab-btn" data-admin-tab="orders">Pedidos Colombia</button>
        <button type="button" class="tab-btn" data-admin-tab="coupons">Cupones</button>
        <button type="button" class="tab-btn" data-admin-tab="audit">Auditoría (audit_logs)</button>
      </div>

      <div id="adminTabContent"></div>
    </main>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
